[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azul-summer-pavilion-ai"
version = "0.1.0"
description = "Rules-faithful Azul: Summer Pavilion simulator and self-play AI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
